# 发布：main 有新提交（或手动触发）时构建全部版本、生成并签名索引，写入 dist 分支。
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只跑一个发布，排队执行，不取消进行中的发布
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检出 dist 分支到 dist/
        run: |
          if git ls-remote --exit-code --heads origin dist > /dev/null; then
            git fetch origin dist
            git worktree add -B dist dist origin/dist
          else
            git worktree add --orphan -b dist dist
          fi

      - name: 校验条目
        run: node scripts/validate.mjs

      - name: 构建全部版本
        run: node scripts/build.mjs --all --out .build --published dist/published.json

      - name: 生成并签名索引
        env:
          FYNVRA_INDEX_SIGNING_KEY: ${{ secrets.FYNVRA_INDEX_SIGNING_KEY }}
        run: node scripts/publish.mjs --dist dist --build .build

      - name: 验证 dist
        run: |
          if [ -f keys/index-public.pem ]; then
            node scripts/verify.mjs --dist dist --public-key keys/index-public.pem
          else
            echo "::warning::仓库中还没有 keys/index-public.pem，跳过 dist 验签"
          fi

      - name: 提交并推送 dist
        working-directory: dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "dist 没有变化"
            exit 0
          fi
          git commit -m "chore(dist): publish ${GITHUB_SHA}"
          git push origin dist
